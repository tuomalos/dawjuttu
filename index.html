<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dawjuttu - Beat Sequencer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>dawjuttu - Beat Sequencer</h1>
            <div class="controls-top">
                <div class="control-group">
                    <label>BPM:</label>
                    <input type="number" id="bpm-input" value="120" min="40" max="300">
                </div>
            </div>
        </div>

        <!-- Transport Controls -->
        <div class="transport">
            <button id="play-btn" class="btn btn-play">▶ Play</button>
            <button id="pause-btn" class="btn btn-pause">⏸ Pause</button>
            <button id="stop-btn" class="btn btn-stop">■ Stop</button>
            <div class="step-display" id="step-info">Step: 1</div>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="channel-rack-tab">Channel Rack</button>
            <button class="tab-btn" data-tab="piano-roll-tab">Piano Roll</button>
        </div>

        <!-- Channel Rack Tab -->
        <div id="channel-rack-tab" class="tab-content active">
            <div class="channel-rack-container">
                <div class="channel-rack-header">
                    <div class="rack-menu">
                        <button class="rack-btn">▶</button>
                        <button class="rack-btn">All</button>
                        <button class="rack-btn">⋮</button>
                    </div>
                </div>
                <div class="channel-rack-scroll">
                    <div class="channel-rack" id="channel-rack">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Piano Roll Tab -->
        <div id="piano-roll-tab" class="tab-content">
            <div class="piano-roll-container">
                <div class="piano-keys" id="piano-keys">
                    <!-- Populated by JS -->
                </div>
                <div class="piano-roll-grid" id="piano-roll-grid">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <!-- Master Volume -->
        <div class="master-section">
            <label>Master Volume:</label>
            <input type="range" id="master-volume" min="0" max="100" value="50" class="master-slider">
            <span id="volume-display">50%</span>
        </div>

        <!-- Keyboard Shortcuts -->
        <div class="shortcuts">
            <div class="shortcuts-title">KEYBOARD SHORTCUTS</div>
            <div class="shortcuts-content">
                <span><strong>SPACE:</strong> Play/Pause</span>
                <span><strong>S:</strong> Stop</span>
                <span><strong>M + 1-4:</strong> Mute track</span>
                <span><strong>Click steps:</strong> Toggle notes</span>
                <span><strong>Click piano:</strong> Add notes</span>
            </div>
        </div>
    </div>

    <script src="daw.js"></script>
</body>
</html>
